# Pandemonium - Diarization-Conditioned Parakeet, CTC head, with a session's speakers batched
# together so the encoder can COMMUNICATE across them and REFINE the STNO mask.
#
# Same FDDT-conditioned CTC encoder as conf/dicop_ctc.yaml, but the encoder is
# `ConformerEncoderCrossSpeaker`: at the layers in `cross_speaker_layers` the speakers of one
# session attend across one another (cross-speaker attention), and at the layers in `refine_layers` the model
# re-estimates the 4-channel STNO mask from those cross-speaker-informed hidden states and
# conditions the deeper layers on it. Both start inert (gated), so a warm start from
# Parakeet-TDT-0.6b-v3 (or a DiCoP-CTC checkpoint) begins identical to DiCoP-CTC.
#
# One item is a WHOLE SESSION carrying one target-speaker STNO mask + transcript per speaker (up
# to `num_speaker_slots`); the model expands the shared audio to one encoder row per speaker.

name: pandemonium
seed: 1234

evaluate_at_start: false

init_from_pretrained: nvidia/parakeet-tdt-0.6b-v3

# Which head `train.py` builds: `pandemonium` -> EncDecCrossSpeakerCTCBPEModelSTNO.
head: pandemonium
# init_from_ptl_ckpt: ???  # Resume weights (only) from a Pandemonium / DiCoP-CTC checkpoint.
model:
  sample_rate: 16000
  compute_eval_loss: true
  log_prediction: true
  skip_nan_grad: false

  # Maximum speaker streams per session. A session with more speakers loses the surplus (scored as
  # deletions). This is NOT tied to the encoder's `global_tokens`.
  num_speaker_slots: 6

  fddt_lr_multiplier: 1.0
  sink_gate_lr_multiplier: 300.0
  sink_lr_multiplier: 0.4
  head_lr_multiplier: 1.0

  # The two new from-scratch encoder blocks. Both start inert. The cross-speaker attention opens through a
  # tanh gate (healthy gradient at 0), so the base rate is fine. The refiner's blend gate is a
  # sigmoid starting at -8, the same near-shut value the attention-sink gate uses, and needs an
  # above-base rate to open -- raise this (as sinks use 300x) if `refine_gate` does not move.
  cross_speaker_lr_multiplier: 1.0
  mask_refiner_lr_multiplier: 10.0

  sink_gate_warmup_steps: 0

  # The speaker-count objective reads the sinks per encoder row; a grouped batch has per-session
  # counts instead, so it is off here.
  speaker_count_loss_weight: 0.0
  max_speakers: 8

  text_norm: whisper_nsf
  log_training_wer: false

  local_attn_oom_fallback: false
  local_attn_eval_context: [256, 256]
  offload_optimizer_on_eval: true

  meeteval:
    tcp_collar: 5
    output_per_word_timestamps: true

  model_defaults:
    enc_hidden: ${model.encoder.d_model}
    pred_hidden: 640
    joint_hidden: 640
    tdt_durations: [0, 1, 2, 3, 4]
    num_tdt_durations: 5
  train_ds:
    manifest_filepath: ???
    # use_lhotse: true
    sample_rate: ${model.sample_rate}
    batch_size: 16
    shuffle: true
    num_workers: 4
    prefetch_factor: 2
    pin_memory: true
    max_duration: 10000
    min_duration: 0.1

    # Duration-based batching. NOTE the budget is per SESSION duration, but each session expands to
    # up to `num_speaker_slots` encoder rows (one per speaker), so the real GPU batch is
    # `sum_of_session_speakers x longest`. Set this well below conf/dicop_ctc.yaml's 1200 -- roughly
    # divided by the average speaker count -- and watch the first steps' memory. 200 is a safe start
    # for 30 s windows with ~4-6 speakers.
    max_batch_duration: 200
    max_batch_size: 64
    num_buckets: 10
    corpus_weights: null
    epoch_items: null
    channel_selector: average

    # Corrupt the diarization mask during training (per speaker), so FDDT sees something closer to
    # a diarizer's output. Lhotse only, training only. The mask refiner has more to correct when
    # the input mask is noisier, which is the point.
    stno_augment:
      segment_prob: 0.5
      change_prob: 0.2
      min_seg_len: 5
      max_seg_len: 20
      gaussian_prob: 0.5
      gaussian_var: 0.05

  validation_ds:
    manifest_filepath: ???
    # use_lhotse: true
    sample_rate: ${model.sample_rate}
    # One whole session (all its speakers) per item.
    batch_size: 1
    shuffle: false
    use_start_end_token: false
    num_workers: 2
    prefetch_factor: 2
    pin_memory: false
    channel_selector: average

  test_ds:
    manifest_filepath: null
    # use_lhotse: true
    sample_rate: ${model.sample_rate}
    batch_size: 1
    shuffle: false
    use_start_end_token: false
    num_workers: 8
    pin_memory: true
    channel_selector: average

  tokenizer:
    dir: ""
    type: bpe

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: ${model.sample_rate}
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 128
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 50
    freq_width: 27
    time_width: 0.002
  encoder:
    _target_: src.model.modules.cross_speaker_encoder.ConformerEncoderCrossSpeaker
    feat_in: ${model.preprocessor.features}
    feat_out: -1
    n_layers: 24
    d_model: 1024
    use_bias: false

    # --- Pandemonium additions ---
    # Zero-based layer indices after which a session's speakers attend across each other, and the
    # (subset of those) layers after which the STNO mask is re-estimated. Refinement reads the
    # hidden states after cross-speaker attention, so every refine layer must also be one.
    cross_speaker_layers: [8, 12, 16, 20]
    refine_layers: [12, 16, 20]
    cross_speaker_heads: 8
    cross_speaker_dropout: 0.1
    # Blend gate starts near-shut (as the attention-sink gate does), so the refined mask starts
    # all but equal to the input mask and fades in.
    refine_gate_init: -8.0

    subsampling: dw_striding
    subsampling_factor: 8
    subsampling_conv_channels: 256
    causal_downsampling: false

    reduction: null
    reduction_position: null
    reduction_factor: 1

    ff_expansion_factor: 4

    self_attention_model: rel_pos_local_attn
    n_heads: 8
    att_context_size: [256, 256]
    att_context_style: regular
    xscaling: false
    untie_biases: true
    pos_emb_max_len: 45000

    global_tokens: 4
    global_tokens_spacing: 1
    learnable_sink_tokens: true
    global_attn_separate: true
    init_global_attn_from_local: true
    sink_gate_init: -8.0

    use_pytorch_sdpa: false

    conv_kernel_size: 9
    conv_norm_type: 'batch_norm'
    conv_context_size: null

    dropout: 0.1
    dropout_pre_encoder: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

    stochastic_depth_drop_prob: 0.0
    stochastic_depth_mode: linear
    stochastic_depth_start_layer: 1

    activation_checkpointing: false

    ### FDDT conditioning.
    fddt_non_target_rate: 0.5
    fddt_is_diagonal: true
    fddt_bias_only: false
    fddt_use_silence: true
    fddt_use_target: true
    fddt_use_non_target: true
    fddt_use_overlap: true

  decoder:
    _target_: src.model.modules.joint_ctc_decoder.JointCTCDecoder
    feat_in: ${model.model_defaults.enc_hidden}
    num_classes: -1
    vocabulary: null
    pred_hidden: ${model.model_defaults.pred_hidden}
    joint_hidden: ${model.model_defaults.joint_hidden}
    activation: relu
    dropout: 0.2
    num_extra_outputs: ${model.model_defaults.num_tdt_durations}

  ctc_reduction: mean_batch

  decoding:
    strategy: "greedy_batch"
    compute_timestamps: true
    preserve_alignments: false

  freeze_decoder: true

  # A second, transducer decode at validation is off here: it decodes per encoder row and the
  # grouped path already runs G rows per session. Keep the CTC selection metric only.
  eval_tdt: false
  eval_tdt_metric: false

  optim:
    name: adamw
    lr: 0.5
    betas: [0.9, 0.98]
    weight_decay: 1e-3

    sched:
      name: NoamAnnealing
      d_model: ${model.encoder.d_model}
      warmup_steps: 2000
      warmup_ratio: null
      min_lr: 1e-6

trainer:
  devices: -1
  num_nodes: 1
  use_distributed_sampler: false
  max_epochs: 500
  max_steps: -1
  val_check_interval: 1.0
  accelerator: auto
  strategy: ddp
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: bf16
  log_every_n_steps: 10
  enable_progress_bar: True
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  sync_batchnorm: true
  enable_checkpointing: False
  logger: false
  benchmark: false

exp_manager:
  exp_dir: ???
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val/cp_wer"
    mode: "min"
    save_top_k: 5
    always_save_nemo: True
  resume_from_checkpoint: null
  resume_if_exists: false
  resume_ignore_no_checkpoint: false

  create_wandb_logger: false
  wandb_logger_kwargs:
    name: ${name}
    project: dicop
