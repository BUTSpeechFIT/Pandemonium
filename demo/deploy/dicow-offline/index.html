<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiCoW demo offline</title>
<style>
 :root { --bg:#fafafa; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --card:#fff; --accent:#0e9f6e; }
 @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --fg:#e5e7eb; --muted:#9ca3af; --line:#1f2937; --card:#111827; } }
 body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
 main { max-width:560px; margin:12vh auto 40px; padding:0 16px; }
 .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
 h1 { font-size:22px; margin:0 0 8px; }
 p { margin:10px 0; }
 .muted { color:var(--muted); font-size:14px; }
 a { color:var(--accent); }
</style>
</head>
<body>
<main><div class="card">
 <h1>The DiCoW demo is currently offline</h1>
 <p>If you would like to access it, please contact
 <a href="mailto:ipoloka@fit.vut.cz">ipoloka@fit.vut.cz</a>.</p>
 <p class="muted">BUT Speech@FIT, Faculty of Information Technology, Brno University of Technology &middot;
 <a href="https://github.com/BUTSpeechFIT/DiCoW">DiCoW on GitHub</a></p>
</div></main>
</body>
</html>
