# The demo's two locations in nginx: paste them into the HTTPS server{} block that serves the host
# (on pcspeech-demo: /etc/nginx/sites-available/default), then `sudo nginx -t && sudo systemctl reload nginx`.
# /dicow/ serves dicow-offline/index.html, installed as /var/www/dicow-offline/index.html.

    # DiCoW is offline (its service is stopped): a static notice for every /dicow/ URL.
    location = /dicow { return 301 /dicow/; }
    location /dicow/ {
	root /var/www/dicow-offline;
	rewrite ^ /index.html break;
	add_header Cache-Control "no-store";
    }

    # Pandemonium demo (pandemonium-demo.service, ~/Pandemonium/demo), Gradio with root_path=/pandemonium.
    location = /pandemonium { return 301 /pandemonium/; }
    location /pandemonium/ {
	proxy_pass http://127.0.0.1:7861/;

	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;

	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";

	# Gradio's queue streams over SSE; a transcription of 40 min of audio takes minutes.
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_connect_timeout 60s;

	# Uploads up to 40 min of audio (the app itself refuses anything over 1 GB).
	client_max_body_size 1g;
	proxy_request_buffering off;
    }
